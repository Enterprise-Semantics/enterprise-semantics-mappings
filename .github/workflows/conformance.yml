# enterprise-semantics-mappings CI Gate
#
# Phase 5 (PLAN §Phase 5.1-5.2): the conformance gate from
# enterprise-semantics-test-probe is applied to this mappings repo as well.
# Mappings must conform to the authority repo's identifier scheme and
# lifecycle model.
name: conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout enterprise-semantics (authority)
        uses: actions/checkout@v4
        with:
          repository: Enterprise-Semantics/enterprise-semantics
          path: enterprise-semantics
          fetch-depth: 1

      - name: Checkout enterprise-semantics-mappings (this repo)
        uses: actions/checkout@v4
        with:
          path: enterprise-semantics-mappings
          fetch-depth: 1

      - name: Checkout enterprise-semantics-test-probe
        uses: actions/checkout@v4
        with:
          repository: Enterprise-Semantics/enterprise-semantics-test-probe
          path: enterprise-semantics-test-probe
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run conformance gate
        run: |
          python3 enterprise-semantics-test-probe/tools/validate.py \
            --mode all \
            --source "$(pwd)/enterprise-semantics"
