# Mapping: ES:CONCEPT:value-stream -> OpenDEA Value Stream construct
#
# Per CR-ES-003 §22 + ADR-ES-003 §27.
# OpenDEA may represent Value Stream as an enterprise architecture
# construct. This is a mapping only, no OpenDEA metamodel
# modification per CR-ES-003 §3.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-23)

source: ES:CONCEPT:value-stream
