# Mapping: ES:CONCEPT:agentic-workflow -> OpenDEA Workflow execution specialisation
#
# Per CR-ES-006 §20 + ADR-ES-006 §16.
# OpenDEA may represent Agentic Workflow as an execution specialisation
# of OpenDEA Workflow. No OpenDEA metamodel modification is required
# by this CR.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-23)

id: ES:MAP:agentic-workflow-to-opendea
canonical_name: Agentic Workflow -> OpenDEA mapping
status: Candidate
version: 0.5.0
mapping_type: specialization
authority: opendea

# Per CR-ES-006 §20

source:
  id: ES:CONCEPT:agentic-workflow
  canonical_name: Agentic Workflow
  defined_by: CR-ES-006 §5 + ADR-ES-006 §2

target:
  # OpenDEA may not have a canonical Agentic Workflow element. Per
  # CR-ES-006 §20 the mapping represents semantic correspondence
  # rather than implementation availability.
  id: external:opendea:Workflow
  canonical_name: OpenDEA Workflow
  note: |
    If OpenDEA does not have a directly corresponding Agentic
    Workflow element ;; the mapping documents the intended semantic
    correspondence rather than asserting implementation availability.

# Mapping semantic

relationship: |
  Agentic Workflow is a Tier 2 Specialisation of OpenDEA Workflow
  (execution level). The specialisation adds agentic behaviour, 
  bounded authority, dynamic decision-making, and runtime
  adaptation while preserving the OpenDEA Workflow semantics.

mapping_relationship:
  - predicate: specializes
    subject: ES:CONCEPT:agentic-workflow
    object: external:opendea:Workflow
    qualification: execution-level-specialisation

  - predicate: engages
    subject: ES:CONCEPT:agentic-workflow
    object: external:opendea:Agent
    qualification: agent-engagement

  - predicate: operates-within
    subject: ES:CONCEPT:agentic-workflow
    object: external:opendea:Authority
    qualification: bounded-authority

# Per CR-ES-006 §20: implementation availability

implementation_availability: |
  Per CR-ES-006 §20, if no canonical OpenDEA Workflow element
  exists ;; the mapping is marked as a target semantic correspondence
  rather than an implementation claim. The mapping documents how
  OpenDEA may subsequently specialise and operationalise the
  Enterprise-Semantics concept within its enterprise architecture
  metamodel.

# Per ADR-ES-006 §16: no OpenDEA metamodel modification

metamodel_modification: none
metamodel_modification_rationale: |
  Per CR-ES-006 §3 + ADR-ES-006 §16, no OpenDEA metamodel change
  is authorised by this CR. The mapping documents the intended
  specialisation boundary, it does not require OpenDEA to
  introduce a new construct.

# Cardinal rules

cardinal_rules:
  - author: Emmanuel A. Otchere
  - d004_dash_rule: 0 forbidden glyphs
  - vendor_specific_embargo: 0 references ;; no vendor-specific material from embargoed sources
  - naming: lowercase kebab-case per ADR-ES-002 §11

# Provenance

provenance:
  - source: CR-ES-006 §20
    note: OpenDEA mapping specification.
  - source: ADR-ES-006 §16
    note: Architectural position ;; no OpenDEA metamodel modification.
  - source: FND-ES-AG-008 §1.3
    note: Tier 1 / Tier 2 grounding classification.
  - source: https://github.com/Enterprise-Semantics/open-dea
    note: OpenDEA canonical Workflow reference.