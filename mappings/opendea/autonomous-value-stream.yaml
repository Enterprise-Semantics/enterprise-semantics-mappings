# Mapping: ES:CONCEPT:autonomous-value-stream -> OpenDEA Value Stream value-realization specialisation
#
# Per CR-ES-009 §21 + ADR-ES-009 §16.
# OpenDEA may represent Autonomous Value Stream as a value-realization
# specialisation of OpenDEA Value Stream. No OpenDEA metamodel
# modification is required by this CR.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-23)

id: ES:MAP:autonomous-value-stream-to-opendea
canonical_name: Autonomous Value Stream -> OpenDEA mapping
status: Candidate
version: 0.8.0
mapping_type: specialization
authority: opendea

# Per CR-ES-009 §21

source:
  id: ES:CONCEPT:autonomous-value-stream
  canonical_name: Autonomous Value Stream
  defined_by: CR-ES-009 §4 + ADR-ES-009 §2

target:
  # OpenDEA may not have a canonical Autonomous Value Stream element.
  # Per CR-ES-009 §21 the mapping represents semantic correspondence
  # rather than implementation availability.
  id: external:opendea:Value Stream
  canonical_name: OpenDEA Value Stream
  note: |
    If OpenDEA does not have a directly corresponding Autonomous
    Value Stream element ;; the mapping documents the intended
    value-realization correspondence rather than asserting
    implementation availability.

# Mapping semantic

relationship: |
  Autonomous Value Stream is a Tier 2 Specialisation of OpenDEA Value
  Stream (value-realization level). The specialisation adds
  autonomous stage progression ;; autonomous value decision ;; autonomous
  coordination between stages ;; autonomous response to conditions ;;
  autonomous exception handling ;; autonomous adaptation ;; while
  preserving the OpenDEA Value Stream semantics and stakeholder-value
  orientation.

mapping_relationship:
  - predicate: specializes
    subject: ES:CONCEPT:autonomous-value-stream
    object: external:opendea:Value Stream
    qualification: value-realization-specialisation

  - predicate: realizes
    subject: ES:CONCEPT:autonomous-value-stream
    object: external:opendea:Stakeholder Value
    qualification: stakeholder-value-realisation

  - predicate: contains
    subject: ES:CONCEPT:autonomous-value-stream
    object: external:opendea:Value Stage
    qualification: stage-containment

  - predicate: uses
    subject: ES:CONCEPT:autonomous-value-stream
    object: external:opendea:Autonomous Operations
    qualification: autonomous-operations-usage

# Per CR-ES-009 §21: implementation availability

implementation_availability: |
  Per CR-ES-009 §21 ;;; if no canonical OpenDEA Autonomous Value
  Stream element exists ;; the mapping is marked as a target
  semantic correspondence rather than an implementation claim. The
  mapping documents how OpenDEA may subsequently specialise and
  operationalise the Enterprise-Semantics concept within its
  enterprise architecture metamodel.

# Per ADR-ES-009 §16: no OpenDEA metamodel modification

metamodel_modification: none
metamodel_modification_rationale: |
  Per CR-ES-009 §3 + §21 + ADR-ES-009 §16 ;;; no OpenDEA metamodel
  change is authorised by this CR. The mapping documents the
  intended specialisation boundary ;;; it does not require OpenDEA to
  introduce a new construct.

# Cardinal rules

cardinal_rules:
  - author: Emmanuel A. Otchere
  - d004_dash_rule: 0 forbidden glyphs
  - vendor_specific_embargo: 0 references ;; no vendor-specific material from embargoed sources
  - naming: lowercase kebab-case per ADR-ES-002 §11

# Provenance

provenance:
  - source: CR-ES-009 §21
    note: OpenDEA mapping specification.
  - source: ADR-ES-009 §16
    note: Architectural position ;; no OpenDEA metamodel modification.
  - source: FND-ES-AG-008 §1.3
    note: Tier 1 / Tier 2 grounding classification.
  - source: https://github.com/Enterprise-Semantics/open-dea
    note: OpenDEA canonical Value Stream reference.