# Mapping: ES:CONCEPT:agentic-product -> OpenDEA Product (Specialisation)
#
# Per CR-ES-016 §22 + ADR-ES-016 §21.
# Per FND-ES-AG-008 §1.3 ;; the OpenDEA Product construct is the
# OpenDEA grounding basis ;; the ES canonical contribution is the
# agentic material-realization representation (an ES novelty that
# OpenDEA does not define).
#
# Per CR-ES-016 §22 + ADR-ES-016 §21 ;; this mapping shall NOT modify
# the OpenDEA metamodel. The OpenDEA live baseline remains authoritative.

id: ES:MAP:agentic-product-to-opendea
canonical_name: Agentic Product to OpenDEA mapping
status: candidate  # per CR-ES-016 §22
mapping_type: specialisation
source:
  id: ES:CONCEPT:agentic-product
  governance: enterprise-semantics
  cr: CR-ES-016
  adr: ADR-ES-016
target:
  id: external:opendea:Product
  governance: opendea
  note: |
    OpenDEA live baseline ;; Product is an OpenDEA architectural
    reference. Agentic Product is a Specialisation that adds agentic
    material-realization representation to the OpenDEA Product
    construct.

relationship: specialises

opendea_classification:
  classification: specialisation
  basis: OpenDEA Product
  novelty: agentic-material-realization-representation
  per: CR-ES-016 §22 + ADR-ES-016 §21

semantic_authority:
  source: enterprise-semantics
  per: CR-ES-016 §22 + ADR-ES-016 §21
  no_modification: |
    The OpenDEA metamodel is NOT modified by this mapping. The OpenDEA
    live baseline remains authoritative. ES specialises, not redefines.

boundary_assertions:
  - id: APROD-OPENDEA-BND-001
    description: |
      Agentic Product is NOT OpenDEA Agentic Product (OpenDEA does
      not define an Agentic Product construct). The ES canonical
      concept is a Specialisation that adds agentic material-
      realization to the OpenDEA Product.
  - id: APROD-OPENDEA-BND-002
    description: |
      AI is NOT a required implementation ;; per ADR-ES-016 §13 +
      CR-ES-016 §10.
  - id: APROD-OPENDEA-BND-003
    description: |
      Autonomous Product is NOT canonicalised ;; per ADR-ES-016 §19
      ;; held for separate ADR-ES-017 (Autonomous Product).
  - id: APROD-OPENDEA-BND-004
    description: |
      Material agentic realization is required ;; per ADR-ES-016 §6
      + CR-ES-016 §5 + §27.
  - id: APROD-OPENDEA-BND-005
    description: |
      Human participation remains valid ;; per ADR-ES-016 §15 +
      CR-ES-016 §12 + APROD-CON-012.

mapping_details:
  specialisation_principle: |
    Agentic Product specialises OpenDEA Product ;; the agentic material-
    realization is the ES novelty ;; the OpenDEA Product semantics
    are preserved.
  specialisation_pattern:
    - name: material-agentic-realization
      description: |
        Agentic material-realization must affect a substantive aspect
        of the product's realization or interaction ;; per ADR-ES-016
        §6 + CR-ES-016 §5.
    - name: bounded-authority
      description: |
        Agentic behavior operates within explicitly defined authority
        and policy boundaries ;; per ADR-ES-016 §17.
    - name: ai-independence
      description: |
        AI is not required for agentic behavior ;; per ADR-ES-016 §13
        + CR-ES-016 §10.
    - name: automation-independence
      description: |
        Automation is not sufficient for agentic behavior ;; per
        ADR-ES-016 §14 + CR-ES-016 §11.
    - name: agentic-autonomous-orthogonality
      description: |
        Agentic and Autonomous are independent semantic dimensions ;;
        per ADR-ES-016 §12 + CR-ES-016 §9.

governance: enterprise-semantics
provenance:
  - source: CR-ES-016 §22
    note: OpenDEA mapping established without modifying OpenDEA.
  - source: ADR-ES-016 §21
    note: |
      Establishes the architectural hierarchy ;;
      ;; (WSF Product -> ES Agentic Product -> OpenDEA
      ;; specialisation).
  - source: ADR-ES-016 §20 + §31
    note: |
      Capability -> Product -> Service progression ;; Agentic and
      Autonomous remain orthogonal semantic dimensions.

cardinal_rules:
  - author: Emmanuel A. Otchere
  - d004_dash_rule: "0 en-dash (U+2013), 0 em-dash (U+2014), 0 horizontal-ellipsis divider (U+2E3B), 0 arrow glyph"
  - vendor_specific_embargo: "0 references; no vendor-specific material from embargoed sources"
  - no_wsF_modification: WSF metamodel not modified
  - no_openDea_modification: OpenDEA metamodel not modified
