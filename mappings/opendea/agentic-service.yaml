# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
# Filing: VS-C of CR-ES-014 , Agentic Service mapping record (OpenDEA) , per CR-ES-014 §15 + ADR-ES-014 §15 + FND-ES-AG-008 §1.3
#
# This file documents the semantic correspondence between ES:CONCEPT:agentic-service
# (established by ADR-ES-014 + CR-ES-014) and the OpenDEA Service semantic kind.
# It does not modify OpenDEA or the OpenDEA metamodel. It does not assert equivalence.
#
# Per CR-ES-014 §15, mappings document semantic correspondence only. No unsupported
# equivalence shall be asserted.

source:
  registry: enterprise-semantics
  concept_id: ES:CONCEPT:agentic-service
  concept_version: v1.3.0
  ratified_by: ADR-ES-014
  implemented_by: CR-ES-014

target:
  registry: opendea
  concept_id: external:opendea:Service
  concept_kind: service
  note: |
    OpenDEA Service is the foundational semantic kind at the
    OpenDEA layer. Agentic Service is a contextual specialization
    of the universal Service concept, which itself maps to
    OpenDEA Service via the established lineage.

correspondence:
  type: specialization
  direction: enterprise-semantics -> opendea
  qualification: |
    Agentic Service specializes Service, which corresponds to
    OpenDEA Service. The specialization is contextual, not
    foundational. The Service concept remains the universal
    semantic kind at both the ES and OpenDEA layers.

boundaries:
  - Agentic Service is NOT a new OpenDEA semantic kind
  - Agentic Service is NOT equivalent to OpenDEA Service ; it is a specialization
  - Agentic Service does NOT modify the OpenDEA metamodel ; it references OpenDEA Service via the parent Service
  - Agentic Service does NOT imply Agentic Capability ; distinct semantic kinds
  - Agentic Service does NOT imply Agentic Workflow ; workflow is execution mechanism
  - Agentic Service does NOT imply Agentic Operations ; Agentic Operations do NOT make every Service Agentic
  - Agentic Service does NOT imply Agentic Value Stream ; may be consumed by Agentic Value Stream without implying it
  - Agentic Service does NOT imply Autonomous Service ; orthogonal at service boundary
  - Agentic Service does NOT require AI
  - Agentic Service does NOT require Automation
  - Agentic Service does NOT require removal of humans

related_mappings:
  - enterprise-semantics/concepts/service.concept.yaml
  - enterprise-semantics/concepts/agentic-service.concept.yaml
  - enterprise-semantics-mappings/opendea/service.yaml
  - enterprise-semantics-mappings/opendea/agentic.yaml
  - enterprise-semantics-mappings/opendea/agentic-service.yaml (this file)
  - enterprise-semantics-mappings/wsf/agentic-service.yaml

provenance:
  - ADR-ES-002 (Enterprise Semantic Model)
  - ADR-ES-004 (Agentic Semantic Grounding)
  - ADR-ES-005 (Agentic Value Stream)
  - ADR-ES-006 (Agentic Workflow)
  - ADR-ES-007 (Agentic Operations)
  - ADR-ES-012 (Agentic Capability)
  - ADR-ES-014 (Agentic Service Semantic Grounding)
  - CR-ES-014 (Implement Agentic Service)
  - FND-ES-AG-008 (WSF Tier 1 / Tier 2 Grounding Boundary)

author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
filing_date: 2026-09-25
status: candidate , awaiting CR-ES-014 implementation acceptance per the canonicalization ritual
