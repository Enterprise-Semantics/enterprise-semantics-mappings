# Mapping: ES:AUTONOMOUS_SYSTEM -> WSF:SYSTEM ; Autonomous System specialization
#
# Per CR-ES-028 section 18 + ES-ADR-028.
# Establishes the specialization mapping between Enterprise-Semantics
# Autonomous System and the WSF System foundational concept.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

id: ES:WSF:autonomous-system
canonical_name: Autonomous System (WSF Specialization Mapping)
status: established
version: 2.4.0
date: 2026-09-26
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics

source:
  authority: Enterprise-Semantics
  concept: AUTONOMOUS_SYSTEM
  governance: enterprise-semantics
  semantic_role: specialization

target:
  authority: WSF
  concept: SYSTEM
  governance: world-semantic-foundation
  semantic_role: foundational

mapping_type: specialization

mapping_record:
  mapping_kind: specialization
  semantic_role: enterprise_specialization
  ownership_transfer: false
  semantic_authority: WSF

correspondence:
  - predicate: specializes
    target_predicate: is-specialized-by
    note: |
      Autonomous System is an Enterprise-Semantics
      specialization of WSF System. It does NOT
      redefine the foundational meaning of System.

mapping_documentation:
  - id: ES-WSF-AUTSYS-MAP-DOC-001
    description: |
      This mapping represents an Enterprise-Semantics
      specialization of WSF System. Semantic authority
      is WSF (WSF-ADR-SYSTEM-001 provisional subject-namespace).
  - id: ES-WSF-AUTSYS-MAP-DOC-002
    description: |
      Autonomous System is materially distinct from
      System by introducing independent progression
      through decisions, actions, coordination, and
      adaptation within defined boundaries.
  - id: ES-WSF-AUTSYS-MAP-DOC-003
    description: |
      Autonomous System and Agentic System remain
      independent dimensions ; no state may be inferred
      from the presence of another (per ES-ADR-028
      section 5 four-state matrix).

boundary_assertions:
  - id: ES-WSF-AUTSYS-BND-001
    description: Autonomous System specializes WSF System per ES-ADR-028 section 1.
  - id: ES-WSF-AUTSYS-BND-002
    description: Autonomous System SHALL NOT require AI per ES-ADR-028 section 6.
  - id: ES-WSF-AUTSYS-BND-003
    description: Automation alone does NOT establish Autonomous System per ES-ADR-028 section 6 + 7.
  - id: ES-WSF-AUTSYS-BND-004
    description: Agent presence alone does NOT establish Autonomous System per ES-ADR-028 section 7 + 10.
  - id: ES-WSF-AUTSYS-BND-005
    description: Autonomous System SHALL remain distinct from Autonomous Operations per ES-ADR-028 section 10.
  - id: ES-WSF-AUTSYS-BND-006
    description: Autonomous System SHALL remain distinct from Agentic System per ES-ADR-028 section 5.
  - id: ES-WSF-AUTSYS-BND-007
    description: Agentic System does NOT imply Autonomous System per ES-ADR-028 section 5.
  - id: ES-WSF-AUTSYS-BND-008
    description: Autonomous System does NOT imply Agentic System per ES-ADR-028 section 5.

provenance:
  source:
    - ES-FOUND-001
    - WSF-ADR-SYSTEM-001 (provisional, per LOCKED-PICKS v9)
    - ES-ADR-027
  decision:
    - ES-ADR-028
  implementation:
    - CR-ES-028

release_target: v2.4.0
