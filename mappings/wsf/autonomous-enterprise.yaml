# Mapping: ES:CONCEPT:autonomous-enterprise -> WSF (Tier 2 Specialisation + ES-canonical novelty)
#
# Per CR-ES-011 §30 + ADR-ES-011 §30 + FND-ES-AG-008 §1.3.
#
# Per FND-ES-AG-008 §1.3:
#   Enterprise = Tier 1 Specialisation (WSF Entity grounds Enterprise)
#   Autonomous Enterprise = Tier 2 Specialisation + ES-canonical novelty
#     with enterprise-level autonomy, 7 characteristics, 16 properties,
#     14 canonical relationships, 22 invariants (AE-AUTO-CON-001..022),
#     18 negative invariants (AE-AUTO-NEG-001..018), 2 mapping records
#     (WSF + OpenDEA), governance, and provenance.
#
# No new WSF foundational Autonomous Enterprise concept is asserted.
# Reuses Enterprise grounding from CR-ES-002.
# Reuses Value Stream grounding from CR-ES-003.
# Reuses Autonomous Value Stream grounding from CR-ES-009.
# Reuses Autonomous Operations grounding from CR-ES-008.
# Reuses Agentic Enterprise grounding from CR-ES-010 (parallel specialisation).
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

id: ES:MAP:autonomous-enterprise-to-wsf
canonical_name: Autonomous Enterprise -> WSF mapping
status: Candidate
version: 1.0.0
mapping_type: specialization
authority: wsf

# Per CR-ES-011 §30 + FND-ES-AG-008 §1.3

source:
  id: ES:CONCEPT:autonomous-enterprise
  canonical_name: Autonomous Enterprise
  defined_by: CR-ES-011 §2 + ADR-ES-011 §1 + §3.1
  tier: Tier 2 Specialisation + ES-canonical novelty

target:
  # WSF does not have a direct Autonomous Enterprise concept. The mapping
  # targets the WSF Entity concept (Tier 1) which grounds Enterprise via
  # ES:CONCEPT:enterprise.
  id: external:wsf:Entity
  canonical_name: WSF Entity
  note: |
    WSF live baseline grounds Enterprise via WSF Entity (Tier 1 per
    FND-ES-AG-008 §1.3). The Autonomous Enterprise specialisation
    adds ES-canonical novelty with the 22 invariants
    (AE-AUTO-CON-001..022), 18 negative invariants
    (AE-AUTO-NEG-001..018), and the 14 canonical relationships
    documented in the source concept record. Autonomous Enterprise
    is a parallel Enterprise specialisation to Agentic Enterprise
    (CR-ES-010 + ADR-ES-010); both ground via WSF Entity through
    Enterprise, neither introduces a new WSF foundational concept.

# Mapping semantic

relationship: |
  Autonomous Enterprise is a Tier 2 Specialisation of WSF Entity via
  Enterprise (enterprise-level grounding). The specialisation adds
  autonomous decision-making, autonomous coordination, autonomous
  execution, autonomous adaptation, autonomous value progression,
  bounded authority, and human intervention compatibility at the
  enterprise boundary, while preserving the WSF Entity semantics
  and the Enterprise profile governance model. The relationship
  does NOT introduce a new WSF concept kind and is NOT a Tier 1
  specialisation.

mapping_relationship:
  - predicate: specializes
    subject: ES:CONCEPT:autonomous-enterprise
    object: external:wsf:Entity
  - predicate: grounded-via
    subject: ES:CONCEPT:autonomous-enterprise
    object: external:wsf:Enterprise
  - predicate: orthogonal-to
    subject: ES:CONCEPT:autonomous-enterprise
    object: ES:CONCEPT:agentic-enterprise
    note: |
      Autonomous Enterprise and Agentic Enterprise are orthogonal
      semantic dimensions per ADR-ES-011 §11. Both ground via WSF
      Entity through Enterprise. The orthogonality is preserved in
      the mapping layer.

# Tier rationale (per FND-ES-AG-008 §1.3)

tier_rationale:
  tier_1:
    target: external:wsf:Entity
    grounding: Enterprise inherits WSF Entity grounding (per CR-ES-002 §19).
  tier_2:
    target: external:wsf:Entity
    grounding: Autonomous Enterprise specialises Enterprise (per CR-ES-011 §2 + ADR-ES-011 §1).
  novelty: |
    ES-canonical novelty includes 22 invariants, 18 negative invariants,
    14 canonical relationships, 7 characteristics, 16 properties,
    bounded authority model, human intervention compatibility, and
    the orthogonality invariant AE-AUTO-CON-013 (Autonomous Enterprise
    does NOT specialise Agentic Enterprise).
  no_new_wsf_concept: |
    No new WSF foundational Autonomous Enterprise concept is asserted.
    The grounding remains at WSF Entity via Enterprise.

# Provenance

provenance:
  - source: CR-ES-011 §30
    note: "WSF mapping for Autonomous Enterprise ; no WSF modification authorised"
  - source: ADR-ES-011 §30
    note: "Autonomous Enterprise WSF grounding ; Tier 2 Specialisation + ES-canonical novelty"
  - source: FND-ES-AG-008 §1.3
    note: "Tier 1 / Tier 2 grounding boundary finding ; establishes the no-new-WSF-foundational-concept invariant"

# Cardinal rules

cardinal_rules:
  author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
  d_004: |
    Zero en-dash, zero em-dash, zero U+2E3B. Comma separators used
    for sentence-internal punctuation per user directive 2026-09-24.
  embargo: |
    Zero references to material from embargoed sources.

# Unresolved grounding dependencies

unresolved_grounding_dependencies:
  - dependency: external:concept:enterprise-objective
    reason: Enterprise Objective concept is not yet canonical on main
  - dependency: external:concept:enterprise-outcome
    reason: Enterprise Outcome concept is not yet canonical on main
  - dependency: external:concept:enterprise-context
    reason: Enterprise Context concept is not yet canonical on main
  - dependency: external:concept:policy
    reason: Policy concept is not yet canonical on main
  - dependency: external:concept:constraint
    reason: Constraint concept is not yet canonical on main
  - dependency: external:concept:workflow
    reason: Autonomous Workflow is held as a future concept per CR-ES-011 §27
