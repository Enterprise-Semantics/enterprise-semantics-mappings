# Mapping: ES:COVERAGE:agentic-autonomous -> WSF Semantic Integrity ; Agentic/Autonomous semantic integrity model correspondence
#
# Per CR-ES-022 section 2 + ADR-ES-022 ; WSF correspondence for the
# semantic integrity and coverage model.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

id: ES:WSF:semantic-integrity
canonical_name: WSF Semantic Integrity Correspondence
status: established
version: 2.0.0
date: 2026-09-25
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics
source_concept: ES:COVERAGE:agentic-autonomous
target_concept: WSF:SemanticIntegrity

correspondence:
  - predicate: governs
    target_predicate: governs
    note: |
      WSF Semantic Integrity governs the Agentic/Autonomous
      semantic family per ADR-ES-022 section 1 + CR-ES-022
      section 2.
  - predicate: applies-to
    target_predicate: applies-to
    note: |
      WSF Semantic Integrity applies to the established family
      per ADR-ES-022 section 6.
  - predicate: prohibits-symmetry
    target_predicate: prohibits-symmetry
    note: |
      WSF Semantic Integrity prohibits mechanical symmetry per
      ADR-ES-022 section 13.
  - predicate: requires-dependency
    target_predicate: requires-dependency
    note: |
      WSF Semantic Integrity requires base concept canonical
      per ADR-ES-022 section 9.

boundary_assertions:
  - id: AAI-MAP-WSF-BND-001
    description: Semantic Integrity does NOT establish Agentic by symmetry per ADR-ES-022 section 13.
  - id: AAI-MAP-WSF-BND-002
    description: Semantic Integrity does NOT establish Autonomous by symmetry per ADR-ES-022 section 13.
  - id: AAI-MAP-WSF-BND-003
    description: Semantic Integrity prohibits AI as canonicalization rationale per ADR-ES-022 section 3.
  - id: AAI-MAP-WSF-BND-004
    description: Semantic Integrity prohibits Automation as canonicalization rationale per ADR-ES-022 section 3.

provenance:
  source:
    - ADR-ES-022
    - CR-ES-022
  decision:
    - ADR-ES-022
  implementation:
    - CR-ES-022
