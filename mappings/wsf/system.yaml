# Mapping: ES:CONCEPT:system -> WSF System ; System semantic grounding
#
# Per CR-ES-027 section 8 + ADR-ES-027. WSF correspondence for the
# System foundational concept. Per Recon-ES-004, System is NOT
# reducible to Entity/Organization/Service/Resource/Process/Workflow.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

id: ES:WSF:system
canonical_name: WSF System Correspondence
status: established
version: 2.5.0
date: 2026-09-25
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics
concept: ES:CONCEPT:system

source_concept:
  id: ES:CONCEPT:system
  canonical_name: System
  governance: enterprise-semantics

target_concept:
  id: WSF:System
  canonical_name: WSF System
  governance: WSF

correspondence:
  - predicate: specializes
    target_predicate: specialization-of
    note: |
      WSF System specialization-of WSF Entity correspondence per
      CR-ES-027 section 8 + ADR-ES-027 section 1.
  - predicate: contains
    target_predicate: contains
    note: |
      WSF System contains WSF Element per CR-ES-027 section 5 +
      ADR-ES-027 section 5.
  - predicate: operates-within
    target_predicate: operates-within
    note: |
      WSF System operates-within WSF Context per CR-ES-027
      section 5 + ADR-ES-027 section 5.
  - predicate: realizes
    target_predicate: realizes
    note: |
      WSF System realizes WSF Function/Purpose per CR-ES-027
      section 5 + ADR-ES-027 section 5.
  - predicate: produces
    target_predicate: produces
    note: |
      WSF System produces WSF Outcome per CR-ES-027 section 5 +
      ADR-ES-027 section 5.

boundary_assertions:
  - id: SYS-MAP-WSF-BND-001
    description: System is NOT Entity per WSF correspondence + Recon-ES-004 + ADR-ES-027 section 6.
  - id: SYS-MAP-WSF-BND-002
    description: System is NOT Organization per WSF correspondence + Recon-ES-004 + ADR-ES-027 section 6.
  - id: SYS-MAP-WSF-BND-003
    description: System is NOT Service per WSF correspondence + Recon-ES-004 + ADR-ES-027 section 6.
  - id: SYS-MAP-WSF-BND-004
    description: System is NOT Resource per WSF correspondence + Recon-ES-004 + ADR-ES-027 section 6.
  - id: SYS-MAP-WSF-BND-005
    description: System is NOT Process per WSF correspondence + Recon-ES-004 + ADR-ES-027 section 6.
  - id: SYS-MAP-WSF-BND-006
    description: System is NOT Workflow per WSF correspondence + Recon-ES-004 + ADR-ES-027 section 6.
  - id: SYS-MAP-WSF-BND-007
    description: System is NOT Capability per WSF correspondence + Recon-ES-004 + ADR-ES-027 section 6.
  - id: SYS-MAP-WSF-BND-008
    description: System is NOT IT system specifically per WSF correspondence + ADR-ES-027 section 6.
  - id: SYS-MAP-WSF-BND-009
    description: Autonomous System remains deferred per WSF correspondence + ADR-ES-022 section 13.

provenance:
  source:
    - ADR-ES-027
    - CR-ES-027
    - Recon-ES-004
  decision:
    - ADR-ES-027
  implementation:
    - CR-ES-027
