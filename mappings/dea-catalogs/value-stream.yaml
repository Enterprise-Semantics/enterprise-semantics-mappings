# Mapping: ES:CONCEPT:value-stream -> DEA Catalogs Value Stream instance
#
# Per CR-ES-003 §23 + ADR-ES-003 §28.
# DEA Catalogs may later instantiate Value Streams and Value Stages.
# Catalog entries shall NOT redefine the foundational meaning of
# Value Stream.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-23)

source: ES:CONCEPT:value-stream
target: external:catalog:ValueStream
mapping_type: instantiation-boundary
relationship: instantiated-by
confidence: 0.85
status: PROPOSED
provenance:
  source: ES
  research: FND-ES-AG-008 §1.3
  decision: ADR-ES-003 §28
  implementation: CR-ES-003 §23
  mapping: null
governing_adr: ADR-ES-003
governing_cr: CR-ES-003

qualification: |
  This mapping establishes the downstream relationship without creating
  catalog content. Per CR-ES-003 §23 ;;; the eventual catalog
  architecture may contain:

  Value Stream
      ;;
      +-- Value Stage
      +-- Capability
      +-- Process
      +-- Outcome
      +-- Stakeholder Value

  ;;; but the actual catalog population requires a separate governed
  catalog change. This mapping record is the boundary declaration, not
  the catalog population.

  Per ADR-ES-003 §28 ;;; the expected semantic authority chain is:

  Semantic Concept ;;; Enterprise-Semantics ;;; OpenDEA
  representation ;;; DEA Catalog ;;; Value Stream Instance

  Catalog classification, industry specialisation, architecture
  coordinates, and implementation views remain downstream concerns.
  Catalog entries do NOT redefine the foundational meaning of Value
  Stream.

  Per CR-ES-003 §3 ;;; this CR does NOT create an industry Value Stream
  catalog or an enterprise-specific Value Stream catalog. Both are
  explicit out-of-scope items held for separate governed catalog
  changes.
